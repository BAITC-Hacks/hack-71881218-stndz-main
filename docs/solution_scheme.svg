<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 830" width="1280" height="830" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1d2733">
  <title>Граф денег — схема решения</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #c9d1db; stroke-width: 1.2; }
      .head { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #5b6675; }
      .title { font-size: 16px; font-weight: 700; }
      .mono { font-family: Consolas, Menlo, monospace; font-size: 12px; }
      .muted { fill: #5b6675; }
      .flow { stroke: #5b6675; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .note { font-size: 12px; fill: #5b6675; }
    </style>
  </defs>

  <rect width="1280" height="830" fill="#f4f6f9"/>

  <text x="20" y="38" font-size="22" font-weight="700">Граф денег — от выгрузки переводов к списку «кого проверять первым»</text>
  <text x="20" y="62" class="note">Одна команда: python run_pipeline.py · полный пересчёт ≈ 5 с (лимит ТЗ — 5 мин) · всё локально, без GPU · выводы — гипотезы для проверки, не утверждения о виновности</text>

  <!-- 1. Данные -->
  <rect class="box" x="20" y="90" width="230" height="380" rx="10"/>
  <text x="36" y="116" class="head">1 · ДАННЫЕ</text>
  <text x="36" y="144" class="title">3 файла .parquet</text>
  <text x="36" y="172" class="mono">nodes         2 248</text>
  <text x="36" y="192" class="mono">edges         3 119</text>
  <text x="36" y="212" class="mono">transactions  4 840</text>
  <text x="36" y="240" class="muted">81 seed-клиент, июль 2026,</text>
  <text x="36" y="258" class="muted">365,9 млн KZT</text>
  <text x="36" y="292" font-weight="700">Ограничения выгрузки</text>
  <text x="36" y="314">• только исходящие переводы</text>
  <text x="36" y="334">• обход обрывается на 4-м колене</text>
  <text x="36" y="354">• переводы &lt; 5 000 KZT не видны</text>
  <text x="36" y="374">• у seed входящие неполные</text>
  <text x="36" y="394">• нет атрибутов клиентов</text>
  <text x="36" y="428" class="note">Учитываются в правилах,</text>
  <text x="36" y="446" class="note">а не игнорируются</text>

  <path class="flow" d="M250,280 L273,280"/>

  <!-- 2. Проверка и граф -->
  <rect class="box" x="275" y="90" width="230" height="380" rx="10"/>
  <text x="291" y="116" class="head">2 · ПРОВЕРКА И ГРАФ</text>
  <text x="291" y="144" class="title">loader · graph</text>
  <text x="291" y="176">• сверка edges ↔ transactions:</text>
  <text x="303" y="194">пары, суммы и n_tx</text>
  <text x="291" y="218">• схема, типы, пустые значения</text>
  <text x="291" y="242">• инвариант: все 444 узла</text>
  <text x="303" y="260">колена 4 без исходящих</text>
  <text x="291" y="284">• все 2 248 узлов в графе,</text>
  <text x="303" y="302">включая 19 изолированных</text>
  <text x="291" y="336" font-weight="700">Направленный граф</text>
  <text x="291" y="358">вес ребра — сумма KZT</text>
  <text x="291" y="378">и число переводов</text>
  <text x="291" y="412" class="note">35 компонент связности;</text>
  <text x="291" y="430" class="note">крупнейшие — 1 877 и 270 узлов</text>

  <path class="flow" d="M505,280 L528,280"/>

  <!-- 3. Признаки -->
  <rect class="box" x="530" y="90" width="250" height="380" rx="10"/>
  <text x="546" y="116" class="head">3 · ПРИЗНАКИ УЗЛА</text>
  <text x="546" y="144" class="title">features</text>
  <text x="546" y="176" class="mono">in_deg / out_deg</text>
  <text x="546" y="193" class="note">разных плательщиков / получателей</text>
  <text x="546" y="220" class="mono">in_kzt / out_kzt, n_tx</text>
  <text x="546" y="237" class="note">суммы и число переводов</text>
  <text x="546" y="264" class="mono">pass_through, retention</text>
  <text x="546" y="281" class="note">сколько ушло дальше / осталось</text>
  <text x="546" y="308" class="mono">ext_inflow</text>
  <text x="546" y="325" class="note">отдал больше, чем получил: приток извне</text>
  <text x="546" y="352" class="mono">seed_payers, seed_reach2</text>
  <text x="546" y="369" class="note">сколько seed в 1–2 шагах вверх</text>
  <text x="546" y="396" class="mono">pagerank, betweenness</text>
  <text x="546" y="413" class="note">влияние по деньгам, посредничество</text>
  <text x="546" y="446" class="note">Все — интерпретируемые числа</text>

  <path class="flow" d="M780,280 L803,280"/>

  <!-- 4. Роли, кластеры, приоритет -->
  <rect class="box" x="805" y="90" width="455" height="380" rx="10"/>
  <text x="821" y="116" class="head">4 · РОЛИ · КЛАСТЕРЫ · ПРИОРИТЕТ</text>
  <text x="821" y="140" class="note">Правила по порядку, первое совпавшее побеждает (analytics/config.py)</text>

  <g font-size="12.5">
    <circle cx="828" cy="162" r="6" fill="#c9a227"/><text x="842" y="166" font-weight="700">coordinator</text><text x="948" y="166">≥ 5 плательщиков и ≥ 10 получателей</text>
    <circle cx="828" cy="186" r="6" fill="#f0873b"/><text x="842" y="190" font-weight="700">distributor</text><text x="948" y="190">≥ 10 получателей</text>
    <circle cx="828" cy="210" r="6" fill="#e53935"/><text x="842" y="214" font-weight="700">consolidator</text><text x="948" y="214">≥ 5 плательщиков, или ≥ 3 и (≥ 3 seed</text>
    <text x="948" y="230">в 2 шагах или получено ≥ p95)</text>
    <circle cx="828" cy="250" r="6" fill="#4aa3e8"/><text x="842" y="254" font-weight="700">transit</text><text x="948" y="254">не seed, ушло дальше 80–120%</text>
    <circle cx="828" cy="274" r="6" fill="#02b140"/><text x="842" y="278" font-weight="700">terminal</text><text x="948" y="278">колено 1–3, осталось ≥ 80% полученного</text>
    <circle cx="828" cy="298" r="6" fill="#7e57c2"/><text x="842" y="302" font-weight="700">boundary</text><text x="948" y="302">колено 4 без исходящих: срез обхода</text>
    <circle cx="828" cy="322" r="6" fill="#8a94a3"/><text x="842" y="326" font-weight="700">peripheral</text><text x="948" y="326">признаков роли нет</text>
  </g>
  <text x="821" y="348" class="note">role_score 0,5–1 — насколько узел превышает порог роли;</text>
  <text x="821" y="362" class="note">evidence — до 200 символов, всегда с числами</text>

  <line x1="821" y1="372" x2="1244" y2="372" stroke="#e2e7ee"/>
  <text x="821" y="390" font-weight="700">Кластеры</text>
  <text x="921" y="390">Louvain (seed = 42): 91 сообщество, в 8 — ≥ 2 seed;</text>
  <text x="921" y="408">гипотеза кластера — по составу ролей</text>
  <text x="821" y="438" font-weight="700">Приоритет</text>
  <text x="921" y="438">поток · структура · объём · сходимость seed ·</text>
  <text x="921" y="456">внешний приток · время; seed × 0,8 — <tspan font-style="italic" class="muted">в работе</tspan></text>

  <!-- переход вниз -->
  <path class="flow" d="M1032,470 L1032,494 L170,494 L170,518"/>

  <!-- 5. Выгрузки -->
  <rect class="box" x="20" y="520" width="300" height="240" rx="10"/>
  <text x="36" y="546" class="head">5 · ВЫГРУЗКИ (output/)</text>
  <text x="36" y="578" class="mono">nodes_roles.csv</text>
  <text x="36" y="595" class="note">2 248 строк: роль, score, кластер, evidence</text>
  <text x="36" y="624" class="mono">clusters.csv</text>
  <text x="36" y="641" class="note">размер, seed, оборот, гипотеза</text>
  <text x="36" y="670" class="mono">top_nodes.csv</text>
  <text x="36" y="687" class="note">≥ 20 узлов с обоснованием</text>
  <text x="36" y="716" class="mono">graph.json</text>
  <text x="36" y="733" class="note">узлы, связи, метрики — для UI и API</text>

  <path class="flow" d="M320,640 L358,640"/>
  <path class="flow" d="M170,760 L170,790 L1040,790 L1040,762"/>

  <!-- 6. Интерфейс -->
  <rect class="box" x="360" y="520" width="430" height="240" rx="10"/>
  <text x="376" y="546" class="head">6 · ИНТЕРФЕЙС АНАЛИТИКА</text>
  <text x="376" y="574" class="title">React + Vite · react-force-graph</text>
  <text x="376" y="604">• граф: стрелки — направление денег,</text>
  <text x="388" y="622">цвет — роль, размер — приоритет</text>
  <text x="376" y="646">• поиск по gid → окрестность узла</text>
  <text x="376" y="670">• карточка: суммы, связи, история, «почему роль»</text>
  <text x="376" y="694">• топ приоритетов и кластеры с гипотезами</text>
  <text x="376" y="718">• пометки ограничений данных (граница выгрузки)</text>
  <text x="376" y="746" class="note">Работает без сервера: читает статический graph.json</text>

  <path class="flow" d="M790,640 L818,640"/>
  <text x="794" y="630" class="note">чат</text>

  <!-- 7. Copilot -->
  <rect class="box" x="820" y="520" width="440" height="240" rx="10"/>
  <text x="836" y="546" class="head">7 · AI-АССИСТЕНТ (опционально)</text>
  <text x="836" y="574" class="title">FastAPI · POST /api/ask</text>
  <text x="836" y="604">вопрос аналитика → LLM выбирает функцию:</text>
  <text x="836" y="624" class="mono">get_node · neighbors · common_collectors</text>
  <text x="836" y="642" class="mono">top_by · path</text>
  <text x="836" y="668">→ ответ со ссылками на реальные gid</text>
  <text x="836" y="694">• числа только из функций, LLM их не придумывает</text>
  <text x="836" y="716">• модель — любая OpenAI-совместимая или локальная</text>
  <text x="836" y="746" class="note">Нет модели → режим правил; пайплайн от LLM не зависит</text>

  <text x="20" y="818" class="note">Правила и пороги — README и analytics/config.py · проверки — tests/ (pytest)</text>
</svg>
